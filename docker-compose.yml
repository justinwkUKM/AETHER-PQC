services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether_pqc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether_pqc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://aether:aether@postgres:5432/aether_pqc
      AUTH_SECRET: local-docker-secret-change-me
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-3.5-flash
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: storage/uploads
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      TEST_AUTH_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./storage/uploads:/app/storage/uploads

volumes:
  postgres-data:
